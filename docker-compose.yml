services:
  dev:
    build:
      context: .
      dockerfile: dev.containerfile
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # ホスト側FSでファイル変更検知が不安定な場合（Docker Desktop for Mac/Windowsの一部環境）は
    # 以下のコメントを外してポーリング監視に切り替える
    # environment:
    #   - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
